# Hooks run on contributors' machines and in CI, so pin each one to a commit that a
# moved tag can't change. To bump one, run
# `pre-commit autoupdate --freeze --repo <url>`, which keeps the `# frozen:` comment.
repos:
  - repo: https://github.com/psf/black
    # 22.x crashes on Python 3.15. 24.0+ adds a blank line after module docstrings,
    # which reorder-python-imports removes again, so the two hooks never settle.
    rev: ec91a2be3c44d88e1a3960a4937ad6ed3b63464e  # frozen: 23.12.1
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0731985330417a281c437a7be4bd7a8f88e31e8d  # frozen: 0.17.1
    hooks:
      - id: check-github-workflows
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: db7346d375eda68a0174f2c057dd97f2fbffe030  # frozen: v4.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: debug-statements
  - repo: https://github.com/asottile/reorder_python_imports
    rev: 4690733311bbfba33558e4d50a7f0092c64d78d8  # frozen: v3.19.0
    hooks:
      - id: reorder-python-imports
        args: [--py38-plus, --add-import, "from __future__ import annotations"]
  - repo: https://github.com/asottile/pyupgrade
    rev: f22ea0651f4355c655cc581f67813c991c74a312  # frozen: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py38-plus]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
