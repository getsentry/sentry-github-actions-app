[project]
name = "Github Actions to Sentry app"
version = "0.0.1"
description = "It listens to workflow events and inserts them into Sentry."
authors = [
    {name = "Armen Zambrano G.", email = "armenzg@sentry.io"},
]
license-expression = "MIT"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/getsentry/sentry-github-actions-app"

[tool.pytest.ini_options]
# -ra:  Show extra test summary info: (a)ll except passed
# -q:   Decrease verbosity
addopts = "-ra -q"
testpaths = [ "tests" ]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "cli.py"]
strict = true
warn_unreachable = true

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = python3.11
skipsdist = true

[testenv]
deps =
    -rrequirements.txt
    -rrequirements-dev.txt
commands =
    pytest
"""
