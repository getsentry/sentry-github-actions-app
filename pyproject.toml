[project]
name = "sentry-github-actions-app"
version = "0.0.1"
description = "It listens to workflow events and inserts them into Sentry."
authors = [
    {name = "Armen Zambrano G.", email = "armenzg@sentry.io"},
]
license-expression = "MIT"
requires-python = ">=3.15"
dependencies = [
    "cachetools==5.3.2",
    "flask==3.1.3",
    "google-cloud-secret-manager==2.32.0",
    "gunicorn==26.2.0",
    "pyjwt[crypto]==2.15.1",
    "requests==2.34.2",
    "sentry-sdk[flask]==2.71.0",
]

[project.urls]
Homepage = "https://github.com/getsentry/sentry-github-actions-app"

[dependency-groups]
dev = [
    "black>=22.3.0",
    "freezegun>=1.2.1",
    "mypy==2.4.1",
    "pre-commit>=2.18.1",
    "pytest>=7.1.1",
    "pytest-cov>=3.0.0",
    "python-dotenv>=0.20.0",
    "responses>=0.20.0",
    "types-cachetools>=5.3.0",
    "types-requests>=2.33.0",
]

[tool.pytest.ini_options]
# -ra:  Show extra test summary info: (a)ll except passed
# -q:   Decrease verbosity
addopts = "-ra -q"
testpaths = [ "tests" ]

[tool.mypy]
python_version = "3.15"
files = ["src", "tests", "cli.py"]
strict = true
warn_unreachable = true

[tool.uv]
# This is an app, not a library, so uv doesn't build or install it.
package = false
