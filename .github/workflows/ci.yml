name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"

# Without this, every job gets a GITHUB_TOKEN that can write to the repo, including
# the third-party actions and dependencies that the jobs run. No job needs more.
permissions:
  contents: read

jobs:
  # In reality, this will not be completely accurate as only when a Docker image is deployed to GCP
  # we will truly have a deployed release. Nevertheless, this will be useful once it is deployed
  # since it will help add commits to releases
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Create a Sentry release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          # This is necessary for the a release to include commits
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        with:
          projects: "sentry-github-actions-app"
          environment: production
          # We have created releases from the PR, thus, the CLI gets confused finding commits
          ignore_missing: true

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build
        run: |
          docker build -t docker-app .

      # A healthy app answers an unsigned webhook with a 400. If gunicorn can't load
      # the app, the container exits and curl gets no response.
      - name: Test starting
        run: |
          docker run -d --name docker-app -p 8080:8080 docker-app
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 15 --retry-delay 1 --retry-all-errors -X POST localhost:8080/ || true)
          if [ "$status" != "400" ]; then
            echo "Expected a 400 from POST /, got $status"
            docker logs docker-app
            exit 1
          fi

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Set up
        run: |
          pip install tox

      - name: Run tests
        run: |
          tox

      # Third-party, so pin it to a commit that a moved tag can't change
      - uses: codecov/codecov-action@f32b3a3741e1053eb607407145bc9619351dc93b # v2.1.0
        with:
          verbose: true # optional (default = false)

  typing:
    name: Type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Set up
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run mypy
        run: |
          mypy

  pre-commit-checks:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Set up
        run: |
          pip install wheel
          pip install pre-commit

      - name: Install hooks
        run: |
          pre-commit install

      - name: Run hooks
        run: |
          pre-commit run --all-files
