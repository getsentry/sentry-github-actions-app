name: CI

on:
  # No paths-ignore here: the required "Required checks" job must report on every PR,
  # or a docs-only PR waits forever for a check that never runs.
  pull_request:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"

# Without this, every job gets a GITHUB_TOKEN that can write to the repo, including
# the third-party actions and dependencies that the jobs run. No job needs more.
permissions:
  contents: read

# Every checkout also sets persist-credentials: false, so the token isn't left in
# .git/config for later steps, and the code they run, to read. No job pushes.

jobs:
  # In reality, this will not be completely accurate as only when a Docker image is deployed to GCP
  # we will truly have a deployed release. Nevertheless, this will be useful once it is deployed
  # since it will help add commits to releases
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Create a Sentry release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # This is necessary for the a release to include commits
          fetch-depth: 0

      - name: Create Sentry release
        # It gets SENTRY_AUTH_TOKEN, so pin it to a commit that a moved tag can't change
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3.7.2
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        with:
          projects: "sentry-github-actions-app"
          environment: production
          # We have created releases from the PR, thus, the CLI gets confused finding commits
          ignore_missing: true

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Reuse layers from earlier runs through the Actions cache, so the `uv sync`
      # layer is reused until pyproject.toml, uv.lock, or a base image changes.
      # mode=max also caches the builder stage, which is where that layer lives.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Build the checked-out files, like `docker build .` did, instead of the
          # action's default of fetching the repo again from git
          context: .
          # Put the image in the local Docker daemon for the steps below
          load: true
          tags: docker-app
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail only on high or critical vulnerabilities that have a fix, such as a newer
      # base image or Python release. Most of the base image's OS findings have no fix.
      - name: Scan image for vulnerabilities
        # Third-party, so pin it to a commit that a moved tag can't change
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: docker-app
          only-fixed: true
          severity-cutoff: high
          output-format: table
          # Restore the vulnerability database from the Actions cache before checking
          # it for updates, instead of downloading it on every run.
          cache-db: true

      # A healthy app answers an unsigned webhook with a 400. If gunicorn can't load
      # the app, the container exits and curl gets no response.
      - name: Test starting
        run: |
          docker run -d --name docker-app -p 8080:8080 docker-app
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 15 --retry-delay 1 --retry-all-errors -X POST localhost:8080/ || true)
          if [ "$status" != "400" ]; then
            echo "Expected a 400 from POST /, got $status"
            docker logs docker-app
            exit 1
          fi

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Third-party, so pin it to a commit that a moved tag can't change
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"

      - name: Set up
        run: |
          uv sync --locked

      - name: Run tests
        run: |
          uv run pytest

  typing:
    name: Type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Third-party, so pin it to a commit that a moved tag can't change
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"

      - name: Set up
        run: |
          uv sync --locked

      - name: Run mypy
        run: |
          uv run mypy

  pre-commit-checks:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Third-party, so pin it to a commit that a moved tag can't change
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"

      - name: Set up
        run: |
          uv sync --locked

      # Without this, every run rebuilds every hook's environment, which is most of
      # the job's time. pre-commit rebuilds any cached environment that's broken.
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks
        run: |
          uv run pre-commit run --all-files

  # The one check the branch ruleset requires, so adding or renaming a job above
  # only means updating this list. It runs even when a job fails, and fails unless
  # every job here succeeded.
  required-checks:
    name: Required checks
    if: ${{ always() }}
    needs: [docker-build, tests, typing, pre-commit-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a required job didn't succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
