name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"

# Without this, every job gets a GITHUB_TOKEN that can write to the repo, including
# the third-party actions and dependencies that the jobs run. No job needs more.
permissions:
  contents: read

jobs:
  # In reality, this will not be completely accurate as only when a Docker image is deployed to GCP
  # we will truly have a deployed release. Nevertheless, this will be useful once it is deployed
  # since it will help add commits to releases
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Create a Sentry release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          # This is necessary for the a release to include commits
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        with:
          projects: "sentry-github-actions-app"
          environment: production
          # We have created releases from the PR, thus, the CLI gets confused finding commits
          ignore_missing: true

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build
        run: |
          docker build -t docker-app .

      - name: Test starting
        run: |
          docker run -d --rm docker-app
          docker stop $(docker ps -aq)

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Third-party, so pin it to a commit that a moved tag can't change
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"

      - name: Set up
        run: |
          uv sync --locked

      - name: Run tests
        run: |
          uv run pytest

      # Third-party, so pin it to a commit that a moved tag can't change
      - uses: codecov/codecov-action@f32b3a3741e1053eb607407145bc9619351dc93b # v2.1.0
        with:
          verbose: true # optional (default = false)

  typing:
    name: Type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Third-party, so pin it to a commit that a moved tag can't change
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"

      - name: Set up
        run: |
          uv sync --locked

      - name: Run mypy
        run: |
          uv run mypy

  pre-commit-checks:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Third-party, so pin it to a commit that a moved tag can't change
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"

      - name: Set up
        run: |
          uv sync --locked

      - name: Run hooks
        run: |
          uv run pre-commit run --all-files
